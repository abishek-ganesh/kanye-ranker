name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright 1.58 has no browser builds for newer Ubuntu, so ubuntu-latest broke the install step
    runs-on: ubuntu-24.04
    # Browser install with system deps takes ~5 min on ubuntu-24.04, E2E ~10 min
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Browser binaries are cached per Playwright version; system packages still install each run
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium webkit

      # Chromium + WebKit; iOS is the majority of traffic
      - name: E2E tests
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Safari"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
